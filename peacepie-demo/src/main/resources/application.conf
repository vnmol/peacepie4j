
peacepie {
    cluster-name = "vmol"
}

pekko {
    actor {
        provider = cluster
    }

    remote.artery {
        canonical {
            hostname = "127.0.0.1"
            port = 7000
        }
    }

    cluster {
        seed-nodes = [
            "pekko://"${peacepie.cluster-name}"@127.0.0.1:7000"
        ]

        downing-provider-class =
            "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
        
        
        startup-timeout = 60s
    }

    loglevel = "INFO"
}

